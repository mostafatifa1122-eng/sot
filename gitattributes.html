<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة - 404</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8faf9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .error-box {
            background: #fff;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .error-box h1 { font-size: 6rem; color: #1b4d3e; }
        .error-box h2 { font-size: 2rem; color: #0f3329; margin-bottom: 1rem; }
        .error-box p { color: #64748b; margin-bottom: 2rem; }
        .btn {
            background: #f5a623;
            color: #000;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover { background: #d98e16; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <h2>الصفحة غير موجودة</h2>
        <p>عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
        <a href="/" class="btn">🏠 العودة للرئيسية</a>
    </div>
</body>
</html>
